name: Pete Private Lab - Offline Compatibility

on:
  push:
    branches:
      - feat/pete-private-lab-yoda-sync-20261014
  pull_request:
    branches:
      - deploy-pete-testlabor-temp-20261011

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      INSTAGRAM_ENGINE_ENABLED: "false"
      INSTAGRAM_SEND_ENABLED: "false"
      WHATSAPP_SEND_ENABLED: "false"
      PETE_LLM_CONVERSATION_ENABLED: "false"
      PETE_LLM_API_CALLS_APPROVED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node --test ../mobile-lab/yoda-exam.test.mjs

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
