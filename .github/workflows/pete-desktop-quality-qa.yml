name: Pete desktop QA - offline only

on:
  push:
    branches:
      - fix/pete-qa-stop-and-appointments-20261021
      - feat/pete-sol-model-support-20261022
      - feat/pete-policy-v4-20261022
  pull_request:
    branches:
      - feat/pete-desktop-flow-builder-draft-20261017

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and mocked QA
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      INSTAGRAM_ENGINE_ENABLED: "false"
      INSTAGRAM_SEND_ENABLED: "false"
      WHATSAPP_SEND_ENABLED: "false"
      PETE_LLM_CONVERSATION_ENABLED: "false"
      PETE_LLM_API_CALLS_APPROVED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test
      - name: Install existing dashboard dependencies for real Vite proxy regression
        run: npm --prefix ../dashboard ci --no-audit --no-fund
      - name: Real desktop session through Vite, no provider network
        run: node --import tsx --test ../scripts/pete-desktop-session-proxy.test.mjs
      - name: Real browser desktop reads, no provider network
        env:
          PETE_DESKTOP_TEST_BROWSER: chrome
        run: node --import tsx --test ../scripts/pete-desktop-browser.test.mjs
      - name: Verify one-use residual dollar cap without network
        working-directory: .
        run: node --test scripts/pete-quality-resume-budget.test.mjs scripts/pete-quality-round2-budget.test.mjs

  dashboard:
    name: Dashboard build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - run: npm run build
