name: Pete Phase 1 - Five Dollar Conversational Followup

# Paid API test on a dedicated scratch branch only. No PR or default branch trigger.
on:
  push:
    branches:
      - phase3-five-dollar-probe-20261012

permissions:
  contents: write

# Reuse the existing shared budget-ledger lock from all Phase 3 workflows.
concurrency:
  group: funnelpilot-pete-phase3-global-budget
  cancel-in-progress: false

jobs:
  four-conversational-personas:
    if: >-
      github.repository == 'VSCodeBot78/funnelpilot-whatsapp-app' &&
      github.ref == 'refs/heads/phase3-five-dollar-probe-20261012' &&
      startsWith(github.event.head_commit.message, 'PETE_5USD_APPROVED_PROBE_20261012')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      NODE_ENV: test
      OPENAI_MODEL: gpt-5.4
      PETE_LLM_CONVERSATION_ENABLED: "true"
      PETE_LLM_API_CALLS_APPROVED: "true"
      PETE_PHASE3_FLAGSHIP_ENVELOPE: "true"
      PETE_PHASE3_APPROVED_RUN: FLAGSHIP_TEN_SYNTHETIC_CHATS
      INSTAGRAM_ENGINE_ENABLED: "false"
      INSTAGRAM_SEND_ENABLED: "false"
      WHATSAPP_SEND_ENABLED: "false"
      ENABLE_GENERIC_WEBHOOKS: "false"
      INSTAGRAM_AUTO_ENABLE_NEW_LEADS: "false"
      WHATSAPP_ALLOW_ALL_RECIPIENTS: "false"
      INSTAGRAM_ALLOW_ALL_SENDERS: "false"
    steps:
      - name: Checkout tested, non-production probe branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout shared, persistent Phase 3 budget ledger
        uses: actions/checkout@v4
        with:
          ref: pete-phase3-budget-ledger
          path: budget-ledger
          fetch-depth: 1
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install and build synthetic backend
        working-directory: backend
        run: |
          npm ci
          npm run build
      - name: Verify API key and historical ledger without exposing key
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ "${#OPENAI_API_KEY}" -lt 15 ]; then
            echo "::error::Provider credential missing. No API test."
            exit 1
          fi
          if [ ! -f budget-ledger/phase3-budget-ledger.json ]; then
            echo "::error::No persisted budget ledger. No API test."
            exit 1
          fi
          git -C budget-ledger config user.name "Funnel Pilot phase3 budget bot"
          git -C budget-ledger config user.email "actions@users.noreply.github.com"
      - name: Reserve and settle two separate 1.50 USD safety batches
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          # The user approved a NEW maximum of 5 USD, starting from
          # the immutable historical project baseline of 4.323801 USD.
          # The first completed probe already consumed 0.090315 USD.
          # Two additional worst-case 1.50 USD reservations stay below 5.
          for batch in 1 2; do
            node - <<'NODE'
          const fs = require("fs");
          const ledger = JSON.parse(fs.readFileSync("budget-ledger/phase3-budget-ledger.json", "utf8"));
          const historicalBaseline = 4323801;
          const maxNew = 5000000;
          const nextReserve = 1500000;
          if (ledger.spentMicroUsd + ledger.reservedMicroUsd + nextReserve - historicalBaseline > maxNew) {
            throw Error("five_usd_incremental_approval_exhausted");
          }
          NODE
            export DATA_DIR="$GITHUB_WORKSPACE/backend/.phase3-data/batch-$batch"
            mkdir -p "$DATA_DIR"
            node scripts/pete-phase3-ledger.mjs reserve "$batch"
            git -C budget-ledger add phase3-budget-ledger.json
            git -C budget-ledger commit -m "Reserve approved Pete USD 1.50 risk batch $batch run $GITHUB_RUN_ID"
            # No API call unless the irreversible reservation is confirmed by GitHub.
            git -C budget-ledger push origin HEAD:pete-phase3-budget-ledger
            set +e
            (cd backend && npx tsx src/config/pete-phase3-flagship-runner.ts "$batch")
            result=$?
            set -e
            node scripts/pete-phase3-ledger.mjs settle "$batch"
            git -C budget-ledger add phase3-budget-ledger.json
            git -C budget-ledger commit -m "Settle Pete risk batch $batch run $GITHUB_RUN_ID"
            git -C budget-ledger push origin HEAD:pete-phase3-budget-ledger
            if [ "$result" -ne 0 ]; then
              echo "::error::Safety test stopped, do not continue."
              exit "$result"
            fi
          done
      - name: Preserve fictional dialogue for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pete-phase1-usd5-approved-four-special-interest-chats
          path: phase3-flagship-reports/*.json
          if-no-files-found: warn
          retention-days: 30
