name: Dashboard 2.0 - Offline Preview Review

on:
  push:
    branches: [feat/dashboard-v2-preview-20261023]

permissions:
  contents: read

concurrency:
  group: dashboard-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:dashboard-v2
      - run: npm run build:dashboard-v2
      - name: Verify default-off bundle excludes the preview data client
        run: node qa/dashboard-v2/check-build.mjs
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:dashboard-v2:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-v2-review-evidence
          path: |
            dashboard/test-results/
            docs/qa/dashboard-v2/screenshots/
          retention-days: 14

  backend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      INSTAGRAM_ENGINE_ENABLED: "false"
      INSTAGRAM_SEND_ENABLED: "false"
      WHATSAPP_SEND_ENABLED: "false"
      PETE_LLM_CONVERSATION_ENABLED: "false"
      PETE_LLM_API_CALLS_APPROVED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check
      # Verify the real Host/Origin/HttpOnly/CSRF handshake through Vite.
      # Test blocks every external provider request and uses an isolated data dir.
      - name: Install existing dashboard Vite for guarded loopback regression
        run: npm --prefix ../dashboard ci --no-audit --no-fund
      - name: Real Vite + Express Pete desktop login, offline only
        run: node --import tsx --test ../scripts/pete-desktop-session-proxy.test.mjs

  owner-laptop-windows-parse:
    name: Owner Laptop GO / Windows PowerShell 5.1 syntax
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check owner launcher syntax and no-send contract
        shell: powershell
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE "scripts\start-owner-laptop.ps1"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw "Windows PowerShell 5.1 rejected Laptop GO"
          }
          $cmd = Get-Content (Join-Path $env:GITHUB_WORKSPACE "FunnelPilot-Laptop-GO.cmd") -Raw
          $body = Get-Content $script -Raw
          if ($cmd -notmatch 'start-owner-laptop.ps1' -or
              $body -notmatch 'INSTAGRAM_SEND_ENABLED = "false"' -or
              $body -notmatch 'WHATSAPP_SEND_ENABLED = "false"' -or
              $body -notmatch 'PETE_LLM_API_CALLS_APPROVED = "false"') {
            throw "NoSend/OneClick safety missing"
          }
          if ($body -match 'git.exe[^\r\n]*(reset|clean|push|pull|checkout|switch)') {
            throw "Unexpected Git mutation in owner launcher"
          }
          Write-Host "PASS: Windows PowerShell 5.1 syntax and guarded local start"
      - name: Real CMD launches local PowerShell script from a path with spaces
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP "Funnel Pilot One Click\Owner Workspace"
          New-Item -ItemType Directory -Path (Join-Path $root "scripts") -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "FunnelPilot-Laptop-GO.cmd") -Destination (Join-Path $root "FunnelPilot-Laptop-GO.cmd")
          $probe = @'
          Set-Content -LiteralPath (Join-Path $PSScriptRoot "..\oneclick-marker.txt") -Value "PASS"
          '@
          Set-Content -LiteralPath (Join-Path $root "scripts\start-owner-laptop.ps1") -Value $probe -Encoding Ascii
          $cmd = Join-Path $root "FunnelPilot-Laptop-GO.cmd"
          & cmd.exe /d /c ('"' + $cmd + '"')
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path (Join-Path $root "oneclick-marker.txt"))) {
            throw "CMD launcher failed under spaces in Windows path"
          }
          Write-Host "PASS: existing CMD button invokes the correct script under Windows paths"
