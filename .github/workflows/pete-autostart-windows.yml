name: Pete AutoStart Windows safety
on:
  push:
    branches:
      - feat/pete-policy-v4-20261022
    paths:
      - scripts/start-pete-auto-release.ps1
      - FunnelPilot-AutoStart.bootstrap.ps1
      - FunnelPilot-AutoStart.cmd
      - .github/workflows/pete-autostart-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell51-parse:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 parse and non-destructive contract
        shell: powershell
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE "scripts\start-pete-auto-release.ps1"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          $bootstrapTokens = $null
          $bootstrapErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE "FunnelPilot-AutoStart.bootstrap.ps1"), [ref]$bootstrapTokens, [ref]$bootstrapErrors) | Out-Null
          if ($bootstrapErrors.Count -ne 0) { throw "Bootstrap WinPS5.1 parse failed" }
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw "Windows PowerShell 5.1 parser rejected AutoStart"
          }
          $s = Get-Content $path -Raw
          if ($s -match 'reset\s+--hard|git\s+clean|git\s+pull|git\s+switch|git\s+checkout') {
            throw "Unsafe destructive source updater command present"
          }
          if (-not ($s -match 'worktree","add"' -and $s -match 'last-ready-sha.txt')) {
            throw "Isolated release and rollback requirements missing"
          }
          if (-not ($s -match 'PETE_LLM_API_CALLS_APPROVED = "false"' -and
              $s -match 'INSTAGRAM_SEND_ENABLED = "false"' -and
              $s -match 'WHATSAPP_SEND_ENABLED = "false"')) {
            throw "No-send and no-cost runtime guard missing"
          }
          $bootstrap = Get-Content (Join-Path $env:GITHUB_WORKSPACE "FunnelPilot-AutoStart.bootstrap.ps1") -Raw
          $shortcut = Get-Content (Join-Path $env:GITHUB_WORKSPACE "FunnelPilot-AutoStart.cmd") -Raw
          if (-not ($bootstrap -match "hash-object" -and $bootstrap -match "expectedGitBlob" -and
              $shortcut -match "AutoStart.bootstrap.ps1")) { throw "Unverified bootstrap shortcut" }
          Write-Host "PASS: WinPS5.1 parses both scripts; detached releases and safe guards present"
      - name: Windows dirty source checkout does not block isolated worktree
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP "fp-dirty-fixture"
          $source = Join-Path $root "FunnelPilot-Desktop-Test"
          $release = Join-Path $root "CleanRelease"
          New-Item -ItemType Directory -Path $source -Force | Out-Null
          & git.exe -C $source init --quiet
          & git.exe -C $source config user.email "ci@example.invalid"
          & git.exe -C $source config user.name "Funnel Pilot QA"
          Set-Content -LiteralPath (Join-Path $source "tracked.txt") -Value "original"
          & git.exe -C $source add tracked.txt
          & git.exe -C $source commit -m "Fixture initial" --quiet
          if ($LASTEXITCODE -ne 0) { throw "Fixture commit failed" }
          Set-Content -LiteralPath (Join-Path $source "tracked.txt") -Value "locally-edited"
          Set-Content -LiteralPath (Join-Path $source "untracked.txt") -Value "private-work"
          & git.exe -C $source worktree add --quiet --detach $release HEAD
          if ($LASTEXITCODE -ne 0) { throw "Clean release worktree creation failed" }
          $existing = (Get-Content -LiteralPath (Join-Path $source "tracked.txt") -Raw).Trim()
          $new = (Get-Content -LiteralPath (Join-Path $release "tracked.txt") -Raw).Trim()
          if ($existing -ne "locally-edited" -or $new -ne "original" -or
            -not (Test-Path -LiteralPath (Join-Path $source "untracked.txt"))) {
            throw "Dirty owner worktree was modified or clean release was contaminated"
          }
          Write-Host "PASS: edited source retained, clean detached release created"
